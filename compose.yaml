# Stack de desarrollo: API + MongoDB + Redis.
#
# Los servicios usan healthcheck y depends_on con condition: service_healthy.
# Sin eso la API arranca antes que la base de datos, y MongoHelpers hace
# process.exit(1) al fallar la conexion: el contenedor muere en un loop.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: authentication-system
    # mongod calcula la caché de WiredTiger a partir de la RAM de la MAQUINA, no
    # del límite del contenedor. Sin acotarla, un contenedor con tope de 2 GiB
    # intenta reservar gigas y se lo come entero. 1 GiB es suficiente para este
    # volumen y deja aire para el resto del proceso.
    command: ['mongod', '--wiredTigerCacheSizeGB', '1']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    # Sin `ports`: la API deja de estar expuesta y la publica nginx. Es lo que
    # permite `docker compose up --scale api=3`; con un puerto fijo el segundo
    # contenedor no puede arrancar.
    environment:
      NODE_ENV: production
      PORT: 3000
      # Nombre del servicio, no localhost: dentro de la red de compose el host de
      # Mongo es el nombre del servicio.
      DATABASE_URL: mongodb://mongo:27017/authentication-system
      SOCKET_CORS_ORIGIN: '${SOCKET_CORS_ORIGIN:-http://localhost:3000}'
      TOKEN_SECRET_KEY: '${TOKEN_SECRET_KEY:?define TOKEN_SECRET_KEY en .env}'
      REFESCH_TOKEN_SECRET_KEY: '${REFESCH_TOKEN_SECRET_KEY:?define REFESCH_TOKEN_SECRET_KEY en .env}'
      RESEND_KEY: '${RESEND_KEY:-}'
      CLIENT_GOOGLE_ID: '${CLIENT_GOOGLE_ID:-}'
      CLIENT_GOOGLE_SECRET: '${CLIENT_GOOGLE_SECRET:-}'
      RATE_LIMIT_MAX: '${RATE_LIMIT_MAX:-300}'
      # Hay exactamente un proxy delante: nginx. Sin esto, `req.ip` es la IP de
      # nginx y el limite por IP reparte la misma cuota entre todos los usuarios.
      TRUST_PROXY: '${TRUST_PROXY:-1}'
      # Cache de verificacion de contrasena. REDIS_ENABLED=false apaga el cache
      # y la API sigue funcionando: el cache nunca es una dependencia dura.
      REDIS_ENABLED: '${REDIS_ENABLED:-true}'
      REDIS_URL: '${REDIS_URL:-redis://redis:6379}'
      PASSWORD_CACHE_TTL_SECONDS: '${PASSWORD_CACHE_TTL_SECONDS:-30}'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness, no liveness: un contenedor que responde pero no puede leer de
      # Mongo no debe quedar "healthy", porque nginx le sigue mandando trafico.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 768M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Unico servicio que publica el puerto de la API.
    ports:
      - '${PORT:-3000}:8080'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/nginx_status || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M


volumes:
  mongo-data:
