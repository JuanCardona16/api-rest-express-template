name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela el run anterior si se suben commits nuevos a la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Formato
        run: pnpm format:check

  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    strategy:
      # Las suites de integracion y funcional comparten el puerto de Mongo en
      # memoria dentro del mismo runner, asi que no se paralelizan.
      max-parallel: 1
      matrix:
        suite: [unit, integration, functional]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Ejecutar suite
        run: pnpm test:${{ matrix.suite }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Construir artefacto
        run: pnpm build

      - name: El artefacto arranca
        # Compilar no alcanza: un bundle puede compilar y morir al ejecutarse.
        # Se levanta con una URL de base de datos invalida a proposito, para
        # comprobar que resuelve imports y llega a la conexion.
        run: |
          DATABASE_URL="mongodb://127.0.0.1:59999/nada" PORT=3999 \
            node dist/index.js & sleep 5; \
            curl -sf http://localhost:3999/api/v1/health && echo "OK"

  imagen:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        run: docker compose build api

  e2e:
    name: Extremo a extremo
    # Solo en main: levanta el stack completo y es el job mas caro.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Levantar el stack
        env:
          TOKEN_SECRET_KEY: ci-token-secret
          REFESCH_TOKEN_SECRET_KEY: ci-refresh-secret
          # Con el limite por defecto la suite se corta con 429 a mitad de camino.
          RATE_LIMIT_MAX: '1000'
        run: docker compose up -d --build --wait

      - name: Esperar la API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health && break
            sleep 2
          done

      - name: E2E
        run: pnpm test:e2e

      - name: Logs del stack
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar el stack
        if: always()
        run: docker compose down -v
