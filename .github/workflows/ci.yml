name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela el run anterior si se suben commits nuevos a la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm ANTES de setup-node: con `cache: pnpm`, setup-node necesita el
      # ejecutable de pnpm en el PATH para resolver el directorio de cache, y
      # falla con "Unable to locate executable file: pnpm" si no lo encuentra.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Formato
        run: pnpm format:check

  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    strategy:
      # Las suites de integracion y funcional comparten el puerto de Mongo en
      # memoria dentro del mismo runner, asi que no se paralelizan.
      max-parallel: 1
      matrix:
        suite: [unit, integration, functional]
    steps:
      - uses: actions/checkout@v4

      # pnpm ANTES de setup-node: con `cache: pnpm`, setup-node necesita el
      # ejecutable de pnpm en el PATH para resolver el directorio de cache, y
      # falla con "Unable to locate executable file: pnpm" si no lo encuentra.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ejecutar suite
        run: pnpm test:${{ matrix.suite }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm ANTES de setup-node: con `cache: pnpm`, setup-node necesita el
      # ejecutable de pnpm en el PATH para resolver el directorio de cache, y
      # falla con "Unable to locate executable file: pnpm" si no lo encuentra.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Construir artefacto
        run: pnpm build

      - name: El artefacto arranca
        # Compilar no alcanza: un bundle puede compilar y morir al ejecutarse.
        # Se levanta con una URL de base de datos invalida a proposito, para
        # comprobar que resuelve imports y llega a la conexion.
        run: |
          DATABASE_URL="mongodb://127.0.0.1:59999/nada" PORT=3999 \
            node dist/index.js & sleep 5; \
            curl -sf http://localhost:3999/api/v1/health && echo "OK"

  imagen:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        # compose declara estas dos con `:?`, o sea que aborta el build si no
        # estan. Son valores de descarte: solo tienen que existir para que la
        # interpolacion de compose no corte el comando.
        env:
          TOKEN_SECRET_KEY: ci-token-secret
          REFESCH_TOKEN_SECRET_KEY: ci-refresh-secret
        run: docker compose build api

  e2e:
    name: Extremo a extremo
    # Corre en pull requests y en push a main.
    #
    # Antes declaraba `if: github.ref == 'refs/heads/main'` y solo se ejecutaba
    # sobre el merge. Eso dejaba un hueco de proceso: ningun PR probaba la suite
    # end-to-end contra el stack real antes de mergear, asi que un PR roto
    # entraba a main y ahi se descubria. Si ademas el merge va directo a main,
    # lo que se despliega ya es lo que fallo.
    #
    # Cuesta mas caro que el resto de los jobs, y esa es exactamente la razon
    # por la que no se puede dejar para despues del merge.
    runs-on: ubuntu-latest
    # A nivel de job, no de step. Los tres pasos que invocan `docker compose`
    # (Levantar, Logs y Bajar) necesitan estas variables: compose aborta al
    # interpolar si faltan, porque el compose las declara con `:?`. Con el
    # bloque a nivel de step, `down -v` fallaba con "required variable
    # TOKEN_SECRET_KEY is missing a value" y el job moria en la limpieza con
    # la suite E2E entera en verde.
    env:
      TOKEN_SECRET_KEY: ci-token-secret
      REFESCH_TOKEN_SECRET_KEY: ci-refresh-secret
      # Con el limite por defecto la suite se corta con 429 a mitad de camino.
      RATE_LIMIT_MAX: '1000'
    steps:
      - uses: actions/checkout@v4

      # pnpm ANTES de setup-node: con `cache: pnpm`, setup-node necesita el
      # ejecutable de pnpm en el PATH para resolver el directorio de cache, y
      # falla con "Unable to locate executable file: pnpm" si no lo encuentra.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Levantar el stack
        run: docker compose up -d --build --wait

      - name: Esperar la API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health && break
            sleep 2
          done

      - name: E2E
        run: pnpm test:e2e

      - name: Logs del stack
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar el stack
        if: always()
        run: docker compose down -v
