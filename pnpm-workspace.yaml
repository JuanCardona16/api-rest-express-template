# pnpm 11+ reemplaza onlyBuiltDependencies por allowBuilds.
# Los settings anteriores se ignoran silenciosamente si se dejan en su lugar.
allowBuilds:
  bcrypt: true
  esbuild: true
  '@scarf/scarf': false
  # Descarga el binario de mongod que usan las pruebas de integracion.
  mongodb-memory-server: true
