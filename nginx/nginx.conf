# Nginx como proxy inverso y balanceador de carga de la API.
#
# Se monta en /etc/nginx/conf.d/, que el nginx oficial incluye dentro del bloque
# `http`. Por eso `map` puede ir aqui arriba.
#
# Resolucion de nombre EN TIEMPO DE PETICION, no al arrancar. Es lo que hace que
# `docker compose up --scale api=3` reparta trafico entre las tres replicas: el
# `resolver` consulta el DNS interno de Docker (127.0.0.11) en cada peticion y
# nginx usa todas las IPs que devuelve. Un `upstream { server api:3000; }`
# resolveria una sola vez al arrancar y se quedaria apuntando a la primera IP
# para siempre, que es el bug clasico del balanceo en Docker.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# `$upstream_addr` dice que replica atendio cada peticion. Sin esto no hay forma
# de comprobar que el balanceo reparte, ni de saber, cuando una replica se pone
# lenta, cuantas peticiones se le quedaron pegadas.
log_format balanceado
  '$remote_addr - [$time_local] "$request" $status '
  'upstream=$upstream_addr upstream_time=$upstream_response_time';

server {
  listen 8080;
  server_name _;

  access_log /dev/stdout balanceado;

  # Mismo limite que `express.urlencoded({ limit: '1mb' })`. Si nginx aceptara
  # mas, la peticion muere en el proxy con un 413 antes de llegar a express.
  client_max_body_size 1m;

  # DNS interno de Docker. `valid=10s` cachea la respuesta 10 segundos: es el
  # punto de equilibrio entre no consultar el registro en cada peticion y no
  # quedarse hablando con una IP que ya no existe.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Estado del balanceador. `stub_status` no esta compilado en todas las
  # imagenes: si esta ruta devuelve 404, la imagen no lo trae.
  location = /nginx_status {
    stub_status;
    access_log off;
  }

  # WebSockets de Socket.IO. El timeout de lectura sube a una hora porque en una
  # conexion abierta y ociosa no hay trafico que lo reinicie: con el valor
  # general nginx cortaria los sockets cada 60s sin que pase nada. El buffering
  # se apaga porque Socket.IO usa polling como transporte de reserva y el
  # handshake HTTP tiene que poder lasting mas que eso.
  location /socket.io/ {
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API REST.
  location / {
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}